name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nếu có nhiều lần push liên tiếp, chỉ chạy lần mới nhất.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Test và build nằm chung một job vì unit test ở đây chạy trên mã nguồn, không
  # chạy trên bản dist — tách ra hai job chỉ khiến npm ci phải chạy hai lần mà
  # job sau không dùng lại được gì của job trước.
  #
  # Thứ tự trong job vẫn là test trước: bước sau chỉ chạy khi bước trước xanh,
  # nên test đỏ là dừng luôn, không build và không deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Chạy unit test
        run: npm run test -- --run

      - name: Build bản tĩnh
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
